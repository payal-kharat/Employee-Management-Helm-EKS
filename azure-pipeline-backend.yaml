
trigger: none
pr: none

parameters:
  - name: DEPLOY_ENV
    displayName: Deployment Environment
    type: string
    default: dev
    values:
      - dev
      - qa
      - uat
      - prod
  - name: IMAGE_TAG
    displayName: Existing DEV Image Tag (Required for QA, UAT and PROD)
    type: string
    default: ''

variables:
  - group: employee-mgm-backend-cicd

pool:
  name: AWS-EKS-Agents

stages:
  - stage: BuildDev
    displayName: 'DEV - Build and Push Backend'
    condition: eq('${{ parameters.DEPLOY_ENV }}', 'dev')
    jobs:
      - job: BuildPushDev
        steps:
          - checkout: self
          - task: Bash@3
            displayName: Build and Push DEV Backend Image
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                export AWS_DEFAULT_REGION="$(AWS_REGION)"
                REGISTRY="$(ECR_REGISTRY)"
                REPOSITORY="$(ECR_REPOSITORY_PREFIX)-dev-backend"
                COMMIT_ID="$(git rev-parse --short HEAD)"
                TAG="DEV-${COMMIT_ID}"
                IMAGE="${REGISTRY}/${REPOSITORY}:${TAG}"

                test -f ./backend/Dockerfile || { echo "ERROR: ./backend/Dockerfile not found"; exit 1; }

                aws sts get-caller-identity
                aws ecr describe-repositories --repository-names "${REPOSITORY}" --region "${AWS_DEFAULT_REGION}"
                aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | docker login --username AWS --password-stdin "${REGISTRY}"

                docker build -f ./backend/Dockerfile -t "${IMAGE}" ./backend
                docker push "${IMAGE}"

                aws ecr describe-images --repository-name "${REPOSITORY}" --image-ids "imageTag=${TAG}" --region "${AWS_DEFAULT_REGION}"
                echo "Built and pushed: ${IMAGE}"

  - stage: PromoteQA
    displayName: 'Promote DEV Backend Image to QA'
    condition: and(not(canceled()), in('${{ parameters.DEPLOY_ENV }}', 'qa', 'uat', 'prod'))
    jobs:
      - job: PromoteToQA
        steps:
          - checkout: none
          - task: Bash@3
            displayName: Promote DEV Backend Image to QA ECR
            env:
              SOURCE_TAG_INPUT: ${{ parameters.IMAGE_TAG }}
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                export AWS_DEFAULT_REGION="$(AWS_REGION)"
                REGISTRY="$(ECR_REGISTRY)"
                PREFIX="$(ECR_REPOSITORY_PREFIX)"
                SOURCE_TAG="${SOURCE_TAG_INPUT}"

                [[ "${SOURCE_TAG}" =~ ^DEV-[A-Za-z0-9._-]+$ ]] || { echo "ERROR: Enter a valid DEV tag, e.g. DEV-b625074"; exit 1; }

                COMMIT_ID="${SOURCE_TAG#DEV-}"
                SOURCE_REPOSITORY="${PREFIX}-dev-backend"
                TARGET_REPOSITORY="${PREFIX}-qa-backend"
                TARGET_TAG="QA-${COMMIT_ID}"

                aws sts get-caller-identity
                aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | docker login --username AWS --password-stdin "${REGISTRY}"
                aws ecr describe-images --repository-name "${SOURCE_REPOSITORY}" --image-ids "imageTag=${SOURCE_TAG}" --region "${AWS_DEFAULT_REGION}"
                aws ecr describe-repositories --repository-names "${TARGET_REPOSITORY}" --region "${AWS_DEFAULT_REGION}"

                docker pull "${REGISTRY}/${SOURCE_REPOSITORY}:${SOURCE_TAG}"
                docker tag "${REGISTRY}/${SOURCE_REPOSITORY}:${SOURCE_TAG}" "${REGISTRY}/${TARGET_REPOSITORY}:${TARGET_TAG}"
                docker push "${REGISTRY}/${TARGET_REPOSITORY}:${TARGET_TAG}"

                aws ecr describe-images --repository-name "${TARGET_REPOSITORY}" --image-ids "imageTag=${TARGET_TAG}" --region "${AWS_DEFAULT_REGION}"
                echo "Promoted ${SOURCE_TAG} to ${TARGET_TAG}"

  - stage: PromoteUAT
    displayName: 'Promote QA Backend Image to UAT'
    dependsOn: PromoteQA
    condition: and(not(canceled()), eq(dependencies.PromoteQA.result, 'Succeeded'), in('${{ parameters.DEPLOY_ENV }}', 'uat', 'prod'))
    jobs:
      - job: PromoteToUAT
        steps:
          - checkout: none
          - task: Bash@3
            displayName: Promote QA Backend Image to UAT ECR
            env:
              SOURCE_TAG_INPUT: ${{ parameters.IMAGE_TAG }}
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                export AWS_DEFAULT_REGION="$(AWS_REGION)"
                REGISTRY="$(ECR_REGISTRY)"
                PREFIX="$(ECR_REPOSITORY_PREFIX)"
                SOURCE_TAG="${SOURCE_TAG_INPUT}"

                [[ "${SOURCE_TAG}" =~ ^DEV-[A-Za-z0-9._-]+$ ]] || { echo "ERROR: Enter a valid DEV tag, e.g. DEV-b625074"; exit 1; }

                COMMIT_ID="${SOURCE_TAG#DEV-}"
                SOURCE_REPOSITORY="${PREFIX}-qa-backend"
                TARGET_REPOSITORY="${PREFIX}-uat-backend"
                SOURCE_TAG_QA="QA-${COMMIT_ID}"
                TARGET_TAG="UAT-${COMMIT_ID}"

                aws sts get-caller-identity
                aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | docker login --username AWS --password-stdin "${REGISTRY}"
                aws ecr describe-images --repository-name "${SOURCE_REPOSITORY}" --image-ids "imageTag=${SOURCE_TAG_QA}" --region "${AWS_DEFAULT_REGION}"
                aws ecr describe-repositories --repository-names "${TARGET_REPOSITORY}" --region "${AWS_DEFAULT_REGION}"

                docker pull "${REGISTRY}/${SOURCE_REPOSITORY}:${SOURCE_TAG_QA}"
                docker tag "${REGISTRY}/${SOURCE_REPOSITORY}:${SOURCE_TAG_QA}" "${REGISTRY}/${TARGET_REPOSITORY}:${TARGET_TAG}"
                docker push "${REGISTRY}/${TARGET_REPOSITORY}:${TARGET_TAG}"

                aws ecr describe-images --repository-name "${TARGET_REPOSITORY}" --image-ids "imageTag=${TARGET_TAG}" --region "${AWS_DEFAULT_REGION}"
                echo "Promoted ${SOURCE_TAG_QA} to ${TARGET_TAG}"

  - stage: ProductionApproval
    displayName: 'PROD - Manual Approval'
    dependsOn: PromoteUAT
    condition: and(not(canceled()), eq(dependencies.PromoteUAT.result, 'Succeeded'), eq('${{ parameters.DEPLOY_ENV }}', 'prod'))
    jobs:
      - job: ManualApproval
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualValidation@1
            timeoutInMinutes: 1440
            inputs:
              notifyUsers: ''
              approvers: ''
              allowApproversToApproveTheirOwnRuns: true
              instructions: |
                Review the backend image before production deployment.
                Original DEV image tag: ${{ parameters.IMAGE_TAG }}
                Approve to promote the same image to PROD.
              onTimeout: reject

  - stage: PromotePROD
    displayName: 'Promote UAT Backend Image to PROD'
    dependsOn: ProductionApproval
    condition: and(not(canceled()), eq(dependencies.ProductionApproval.result, 'Succeeded'), eq('${{ parameters.DEPLOY_ENV }}', 'prod'))
    jobs:
      - job: PromoteToPROD
        steps:
          - checkout: none
          - task: Bash@3
            displayName: Promote UAT Backend Image to PROD ECR
            env:
              SOURCE_TAG_INPUT: ${{ parameters.IMAGE_TAG }}
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                export AWS_DEFAULT_REGION="$(AWS_REGION)"
                REGISTRY="$(ECR_REGISTRY)"
                PREFIX="$(ECR_REPOSITORY_PREFIX)"
                SOURCE_TAG="${SOURCE_TAG_INPUT}"

                [[ "${SOURCE_TAG}" =~ ^DEV-[A-Za-z0-9._-]+$ ]] || { echo "ERROR: Enter a valid DEV tag, e.g. DEV-b625074"; exit 1; }

                COMMIT_ID="${SOURCE_TAG#DEV-}"
                SOURCE_REPOSITORY="${PREFIX}-uat-backend"
                TARGET_REPOSITORY="${PREFIX}-prod-backend"
                SOURCE_TAG_UAT="UAT-${COMMIT_ID}"
                TARGET_TAG="PROD-${COMMIT_ID}"

                aws sts get-caller-identity
                aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | docker login --username AWS --password-stdin "${REGISTRY}"
                aws ecr describe-images --repository-name "${SOURCE_REPOSITORY}" --image-ids "imageTag=${SOURCE_TAG_UAT}" --region "${AWS_DEFAULT_REGION}"
                aws ecr describe-repositories --repository-names "${TARGET_REPOSITORY}" --region "${AWS_DEFAULT_REGION}"

                docker pull "${REGISTRY}/${SOURCE_REPOSITORY}:${SOURCE_TAG_UAT}"
                docker tag "${REGISTRY}/${SOURCE_REPOSITORY}:${SOURCE_TAG_UAT}" "${REGISTRY}/${TARGET_REPOSITORY}:${TARGET_TAG}"
                docker push "${REGISTRY}/${TARGET_REPOSITORY}:${TARGET_TAG}"

                aws ecr describe-images --repository-name "${TARGET_REPOSITORY}" --image-ids "imageTag=${TARGET_TAG}" --region "${AWS_DEFAULT_REGION}"
                echo "Promoted ${SOURCE_TAG_UAT} to ${TARGET_TAG}"

  - stage: Deploy
    displayName: 'Deploy Backend to Selected Environment'
    dependsOn:
      - BuildDev
      - PromoteQA
      - PromoteUAT
      - ProductionApproval
      - PromotePROD
    condition: |
      and(
        not(canceled()),
        or(
          and(eq('${{ parameters.DEPLOY_ENV }}', 'dev'), eq(dependencies.BuildDev.result, 'Succeeded')),
          and(eq('${{ parameters.DEPLOY_ENV }}', 'qa'), eq(dependencies.PromoteQA.result, 'Succeeded')),
          and(eq('${{ parameters.DEPLOY_ENV }}', 'uat'), eq(dependencies.PromoteUAT.result, 'Succeeded')),
          and(eq('${{ parameters.DEPLOY_ENV }}', 'prod'), eq(dependencies.PromotePROD.result, 'Succeeded'))
        )
      )
    jobs:
      - job: DeployBackend
        steps:
          - checkout: self
          - task: Bash@3
            displayName: Deploy Backend with Promoted ECR Image
            env:
              SELECTED_ENV: ${{ parameters.DEPLOY_ENV }}
              SOURCE_TAG_INPUT: ${{ parameters.IMAGE_TAG }}
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                export AWS_DEFAULT_REGION="$(AWS_REGION)"
                REGISTRY="$(ECR_REGISTRY)"
                PREFIX="$(ECR_REPOSITORY_PREFIX)"
                CLUSTER_PREFIX="$(EKS_CLUSTER_PREFIX)"
                CHART="$(HELM_CHART_PATH)"
                RELEASE="$(HELM_RELEASE)"
                ENVIRONMENT="${SELECTED_ENV}"

                case "${ENVIRONMENT}" in
                  dev)
                    NAMESPACE="dev"
                    REPOSITORY="${PREFIX}-dev-backend"
                    TAG="DEV-$(git rev-parse --short HEAD)"
                    ;;
                  qa|uat|prod)
                    SOURCE_TAG="${SOURCE_TAG_INPUT}"
                    [[ "${SOURCE_TAG}" =~ ^DEV-[A-Za-z0-9._-]+$ ]] || { echo "ERROR: Enter the original DEV tag, e.g. DEV-b625074"; exit 1; }
                    COMMIT_ID="${SOURCE_TAG#DEV-}"
                    NAMESPACE="${ENVIRONMENT}"
                    REPOSITORY="${PREFIX}-${ENVIRONMENT}-backend"
                    TAG="$(echo "${ENVIRONMENT}" | tr '[:lower:]' '[:upper:]')-${COMMIT_ID}"
                    ;;
                  *)
                    echo "ERROR: Unsupported environment: ${ENVIRONMENT}"
                    exit 1
                    ;;
                esac

                CLUSTER_NAME="${CLUSTER_PREFIX}-${ENVIRONMENT}-cluster"
                VALUES_FILE="${CHART}/values-${ENVIRONMENT}.yaml"
                IMAGE="${REGISTRY}/${REPOSITORY}"

                test -f "${VALUES_FILE}" || { echo "ERROR: Values file not found: ${VALUES_FILE}"; exit 1; }

                if [[ "${ENVIRONMENT}" == "dev" ]]; then
                  echo "Deploying DEV backend image: ${IMAGE}:${TAG}"
                else
                  echo "Deploying promoted backend image: ${IMAGE}:${TAG}"
                fi

                aws sts get-caller-identity
                aws ecr describe-images --repository-name "${REPOSITORY}" --image-ids "imageTag=${TAG}" --region "${AWS_DEFAULT_REGION}"
                aws eks update-kubeconfig --name "${CLUSTER_NAME}" --region "${AWS_DEFAULT_REGION}"
                kubectl get nodes
                kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -

                helm lint "${CHART}" -f "${VALUES_FILE}"

                helm upgrade --install "${RELEASE}" "${CHART}" \
                  --namespace "${NAMESPACE}" \
                  --create-namespace \
                  -f "${VALUES_FILE}" \
                  --set components.frontend.enabled=false \
                  --set components.frontend.service.enabled=false \
                  --set components.backend.enabled=true \
                  --set components.backend.service.enabled=true \
                  --set-string components.backend.image="${IMAGE}" \
                  --set-string components.backend.tag="${TAG}" \
                  --set components.mysql.enabled=false \
                  --set components.mysql.service.enabled=false \
                  --set ingress.enabled=false \
                  --set configMap.enabled=false \
                  --set secret.enabled=false \
                  --set storageClass.enabled=false \
                  --wait --timeout 10m

                helm status "${RELEASE}" -n "${NAMESPACE}"
                kubectl get pods,svc -n "${NAMESPACE}" -o wide
                echo "Successfully deployed ${IMAGE}:${TAG} to ${ENVIRONMENT}."
