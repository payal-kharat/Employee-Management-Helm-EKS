
trigger:
  - main

pr: none

parameters:
  - name: DEPLOY_ENV
    displayName: Deployment Environment
    type: string
    default: dev
    values:
      - dev
      - qa
      - uat
      - prod
  - name: IMAGE_TAG
    displayName: Existing DEV Image Tag (Required for QA, UAT and PROD)
    type: string
    default: ''

variables:
  AWS_REGION: 'us-east-1'
  AWS_ACCOUNT_ID: '552940445807'
  ECR_REGISTRY: '552940445807.dkr.ecr.us-east-1.amazonaws.com'
  HELM_RELEASE: 'employee-management-system'
  HELM_CHART_PATH: 'employee-management-system'

pool:
  name: AWS-EKS-Agents

stages:
  - stage: BuildDev
    displayName: 'DEV - Build and Push Database'
    condition: eq('${{ parameters.DEPLOY_ENV }}', 'dev')
    jobs:
      - job: BuildPushDev
        steps:
          - checkout: self
          - task: Bash@3
            displayName: Build, Push and Deploy Database in DEV
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                export AWS_DEFAULT_REGION="$(AWS_REGION)"
                REGISTRY="$(ECR_REGISTRY)"
                REPOSITORY="employee-mgm-dev-db"
                COMMIT_ID="$(git rev-parse --short HEAD)"
                TAG="DEV-${COMMIT_ID}"
                IMAGE="${REGISTRY}/${REPOSITORY}"
                IMAGE_REF="${IMAGE}:${TAG}"
                CHART="$(HELM_CHART_PATH)"
                VALUES_FILE="${CHART}/values-dev.yaml"
                CLUSTER_NAME="employee-mgm-dev-cluster"

                login_ecr() {
                  aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | docker login --username AWS --password-stdin "${REGISTRY}"
                }

                deploy_database() {
                  local namespace="$1"
                  local cluster="$2"
                  local values="$3"
                  local repository_uri="$4"
                  local tag="$5"

                  test -f "${values}" || { echo "ERROR: Values file not found: ${values}"; return 1; }
                  helm lint "${CHART}" -f "${values}"
                  aws eks update-kubeconfig --name "${cluster}" --region "${AWS_DEFAULT_REGION}"
                  kubectl get nodes
                  kubectl create namespace "${namespace}" --dry-run=client -o yaml | kubectl apply -f -

                  if ! helm upgrade --install "$(HELM_RELEASE)" "${CHART}" \
                    --namespace "${namespace}" \
                    --create-namespace \
                    -f "${values}" \
                    --set-string mysql.image="${repository_uri}" \
                    --set-string mysql.tag="${tag}" \
                    --wait --timeout 10m; then
                    echo "ERROR: Helm deployment failed. Collecting diagnostics..."
                    helm status "$(HELM_RELEASE)" -n "${namespace}" || true
                    kubectl get pods,pvc,svc -n "${namespace}" -o wide || true
                    kubectl get events -n "${namespace}" --sort-by=.lastTimestamp | tail -40 || true
                    return 1
                  fi

                  helm status "$(HELM_RELEASE)" -n "${namespace}"
                  kubectl get pods,svc,pvc -n "${namespace}" -o wide
                }

                test -f "./db/Dockerfile" || { echo "ERROR: ./db/Dockerfile not found"; exit 1; }
                test -f "${VALUES_FILE}" || { echo "ERROR: ${VALUES_FILE} not found"; exit 1; }

                aws sts get-caller-identity
                aws ecr describe-repositories --repository-names "${REPOSITORY}" --region "${AWS_DEFAULT_REGION}"
                login_ecr
                docker build -f ./db/Dockerfile -t "${IMAGE_REF}" ./db
                docker push "${IMAGE_REF}"
                aws ecr describe-images --repository-name "${REPOSITORY}" --image-ids "imageTag=${TAG}" --region "${AWS_DEFAULT_REGION}"
                echo "Built and verified: ${IMAGE_REF}"

                deploy_database dev "${CLUSTER_NAME}" "${VALUES_FILE}" "${IMAGE}" "${TAG}"

  - stage: PromoteQA
    displayName: 'Promote DEV Image to QA'
    condition: in('${{ parameters.DEPLOY_ENV }}', 'qa', 'uat', 'prod')
    jobs:
      - job: PromoteToQA
        steps:
          - checkout: self
          - task: Bash@3
            displayName: Promote DEV Image to QA and Deploy when QA Selected
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                export AWS_DEFAULT_REGION="$(AWS_REGION)"
                REGISTRY="$(ECR_REGISTRY)"
                SOURCE_TAG="${{ parameters.IMAGE_TAG }}"

                if [[ ! "${SOURCE_TAG}" =~ ^DEV-[A-Za-z0-9._-]+$ ]]; then
                  echo "ERROR: Enter an existing DEV image tag, for example DEV-3c25b00."
                  exit 1
                fi

                COMMIT_ID="${SOURCE_TAG#DEV-}"
                TARGET_TAG="QA-${COMMIT_ID}"
                SOURCE_REPOSITORY="employee-mgm-dev-db"
                TARGET_REPOSITORY="employee-mgm-qa-db"
                SOURCE_IMAGE="${REGISTRY}/${SOURCE_REPOSITORY}:${SOURCE_TAG}"
                TARGET_IMAGE="${REGISTRY}/${TARGET_REPOSITORY}:${TARGET_TAG}"
                CHART="$(HELM_CHART_PATH)"

                login_ecr() {
                  aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | docker login --username AWS --password-stdin "${REGISTRY}"
                }

                promote_image() {
                  local source_repo="$1"
                  local source_tag="$2"
                  local target_repo="$3"
                  local target_tag="$4"

                  aws ecr describe-images --repository-name "${source_repo}" --image-ids "imageTag=${source_tag}" --region "${AWS_DEFAULT_REGION}"
                  aws ecr describe-repositories --repository-names "${target_repo}" --region "${AWS_DEFAULT_REGION}"
                  docker pull "${REGISTRY}/${source_repo}:${source_tag}"
                  docker tag "${REGISTRY}/${source_repo}:${source_tag}" "${REGISTRY}/${target_repo}:${target_tag}"
                  docker push "${REGISTRY}/${target_repo}:${target_tag}"
                  aws ecr describe-images --repository-name "${target_repo}" --image-ids "imageTag=${target_tag}" --region "${AWS_DEFAULT_REGION}"
                  echo "Promoted: ${REGISTRY}/${target_repo}:${target_tag}"
                }

                deploy_database() {
                  local namespace="$1"
                  local cluster="$2"
                  local values="$3"
                  local repository_uri="$4"
                  local tag="$5"

                  test -f "${values}" || { echo "ERROR: Values file not found: ${values}"; return 1; }
                  helm lint "${CHART}" -f "${values}"
                  aws eks update-kubeconfig --name "${cluster}" --region "${AWS_DEFAULT_REGION}"
                  kubectl get nodes
                  kubectl create namespace "${namespace}" --dry-run=client -o yaml | kubectl apply -f -

                  if ! helm upgrade --install "$(HELM_RELEASE)" "${CHART}" \
                    --namespace "${namespace}" \
                    --create-namespace \
                    -f "${values}" \
                    --set-string mysql.image="${repository_uri}" \
                    --set-string mysql.tag="${tag}" \
                    --wait --timeout 10m; then
                    echo "ERROR: Helm deployment failed. Collecting diagnostics..."
                    helm status "$(HELM_RELEASE)" -n "${namespace}" || true
                    kubectl get pods,pvc,svc -n "${namespace}" -o wide || true
                    kubectl get events -n "${namespace}" --sort-by=.lastTimestamp | tail -40 || true
                    return 1
                  fi

                  helm status "$(HELM_RELEASE)" -n "${namespace}"
                  kubectl get pods,svc,pvc -n "${namespace}" -o wide
                }

                aws sts get-caller-identity
                login_ecr
                promote_image "${SOURCE_REPOSITORY}" "${SOURCE_TAG}" "${TARGET_REPOSITORY}" "${TARGET_TAG}"

                if [ "${{ parameters.DEPLOY_ENV }}" = "qa" ]; then
                  deploy_database qa "employee-mgm-qa-cluster" \
                    "${CHART}/values-qa.yaml" \
                    "${REGISTRY}/${TARGET_REPOSITORY}" "${TARGET_TAG}"
                fi

  - stage: PromoteUAT
    displayName: 'Promote QA Image to UAT'
    dependsOn: PromoteQA
    condition: and(succeeded(), in('${{ parameters.DEPLOY_ENV }}', 'uat', 'prod'))
    jobs:
      - job: PromoteToUAT
        steps:
          - checkout: self
          - task: Bash@3
            displayName: Promote QA Image to UAT and Deploy when UAT Selected
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                export AWS_DEFAULT_REGION="$(AWS_REGION)"
                REGISTRY="$(ECR_REGISTRY)"
                SOURCE_TAG="${{ parameters.IMAGE_TAG }}"

                if [[ ! "${SOURCE_TAG}" =~ ^DEV-[A-Za-z0-9._-]+$ ]]; then
                  echo "ERROR: Enter an existing DEV image tag, for example DEV-3c25b00."
                  exit 1
                fi

                COMMIT_ID="${SOURCE_TAG#DEV-}"
                SOURCE_TAG_QA="QA-${COMMIT_ID}"
                TARGET_TAG="UAT-${COMMIT_ID}"
                SOURCE_REPOSITORY="employee-mgm-qa-db"
                TARGET_REPOSITORY="employee-mgm-uat-db"
                CHART="$(HELM_CHART_PATH)"

                login_ecr() {
                  aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | docker login --username AWS --password-stdin "${REGISTRY}"
                }

                promote_image() {
                  local source_repo="$1"
                  local source_tag="$2"
                  local target_repo="$3"
                  local target_tag="$4"

                  aws ecr describe-images --repository-name "${source_repo}" --image-ids "imageTag=${source_tag}" --region "${AWS_DEFAULT_REGION}"
                  aws ecr describe-repositories --repository-names "${target_repo}" --region "${AWS_DEFAULT_REGION}"
                  docker pull "${REGISTRY}/${source_repo}:${source_tag}"
                  docker tag "${REGISTRY}/${source_repo}:${source_tag}" "${REGISTRY}/${target_repo}:${target_tag}"
                  docker push "${REGISTRY}/${target_repo}:${target_tag}"
                  aws ecr describe-images --repository-name "${target_repo}" --image-ids "imageTag=${target_tag}" --region "${AWS_DEFAULT_REGION}"
                  echo "Promoted: ${REGISTRY}/${target_repo}:${target_tag}"
                }

                deploy_database() {
                  local namespace="$1"
                  local cluster="$2"
                  local values="$3"
                  local repository_uri="$4"
                  local tag="$5"

                  test -f "${values}" || { echo "ERROR: Values file not found: ${values}"; return 1; }
                  helm lint "${CHART}" -f "${values}"
                  aws eks update-kubeconfig --name "${cluster}" --region "${AWS_DEFAULT_REGION}"
                  kubectl get nodes
                  kubectl create namespace "${namespace}" --dry-run=client -o yaml | kubectl apply -f -

                  if ! helm upgrade --install "$(HELM_RELEASE)" "${CHART}" \
                    --namespace "${namespace}" \
                    --create-namespace \
                    -f "${values}" \
                    --set-string mysql.image="${repository_uri}" \
                    --set-string mysql.tag="${tag}" \
                    --wait --timeout 10m; then
                    echo "ERROR: Helm deployment failed. Collecting diagnostics..."
                    helm status "$(HELM_RELEASE)" -n "${namespace}" || true
                    kubectl get pods,pvc,svc -n "${namespace}" -o wide || true
                    kubectl get events -n "${namespace}" --sort-by=.lastTimestamp | tail -40 || true
                    return 1
                  fi

                  helm status "$(HELM_RELEASE)" -n "${namespace}"
                  kubectl get pods,svc,pvc -n "${namespace}" -o wide
                }

                aws sts get-caller-identity
                login_ecr
                promote_image "${SOURCE_REPOSITORY}" "${SOURCE_TAG_QA}" "${TARGET_REPOSITORY}" "${TARGET_TAG}"

                if [ "${{ parameters.DEPLOY_ENV }}" = "uat" ]; then
                  deploy_database uat "employee-mgm-uat-cluster" \
                    "${CHART}/values-uat.yaml" \
                    "${REGISTRY}/${TARGET_REPOSITORY}" "${TARGET_TAG}"
                fi

  - stage: ProductionApproval
    displayName: 'PROD - Manual Approval'
    dependsOn: PromoteUAT
    condition: and(succeeded(), eq('${{ parameters.DEPLOY_ENV }}', 'prod'))
    jobs:
      - job: ManualApproval
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualValidation@1
            timeoutInMinutes: 1440
            inputs:
              notifyUsers: ''
              approvers: ''
              allowApproversToApproveTheirOwnRuns: true
              instructions: |
                Review the database image before production deployment.
                Original DEV image tag: ${{ parameters.IMAGE_TAG }}
                Approve to promote the same image to PROD and deploy.
              onTimeout: reject

  - stage: PromotePROD
    displayName: 'Promote UAT Image to PROD and Deploy'
    dependsOn: ProductionApproval
    condition: and(succeeded(), eq('${{ parameters.DEPLOY_ENV }}', 'prod'))
    jobs:
      - job: PromoteDeployPROD
        steps:
          - checkout: self
          - task: Bash@3
            displayName: Promote UAT Image to PROD and Deploy
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                export AWS_DEFAULT_REGION="$(AWS_REGION)"
                REGISTRY="$(ECR_REGISTRY)"
                SOURCE_TAG="${{ parameters.IMAGE_TAG }}"

                if [[ ! "${SOURCE_TAG}" =~ ^DEV-[A-Za-z0-9._-]+$ ]]; then
                  echo "ERROR: Enter an existing DEV image tag, for example DEV-3c25b00."
                  exit 1
                fi

                COMMIT_ID="${SOURCE_TAG#DEV-}"
                SOURCE_TAG_UAT="UAT-${COMMIT_ID}"
                TARGET_TAG="PROD-${COMMIT_ID}"
                SOURCE_REPOSITORY="employee-mgm-uat-db"
                TARGET_REPOSITORY="employee-mgm-prod-db"
                CHART="$(HELM_CHART_PATH)"
                VALUES_FILE="${CHART}/values-prod.yaml"

                login_ecr() {
                  aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | docker login --username AWS --password-stdin "${REGISTRY}"
                }

                promote_image() {
                  local source_repo="$1"
                  local source_tag="$2"
                  local target_repo="$3"
                  local target_tag="$4"

                  aws ecr describe-images --repository-name "${source_repo}" --image-ids "imageTag=${source_tag}" --region "${AWS_DEFAULT_REGION}"
                  aws ecr describe-repositories --repository-names "${target_repo}" --region "${AWS_DEFAULT_REGION}"
                  docker pull "${REGISTRY}/${source_repo}:${source_tag}"
                  docker tag "${REGISTRY}/${source_repo}:${source_tag}" "${REGISTRY}/${target_repo}:${target_tag}"
                  docker push "${REGISTRY}/${target_repo}:${target_tag}"
                  aws ecr describe-images --repository-name "${target_repo}" --image-ids "imageTag=${target_tag}" --region "${AWS_DEFAULT_REGION}"
                  echo "Promoted: ${REGISTRY}/${target_repo}:${target_tag}"
                }

                deploy_database() {
                  local namespace="$1"
                  local cluster="$2"
                  local values="$3"
                  local repository_uri="$4"
                  local tag="$5"

                  test -f "${values}" || { echo "ERROR: Values file not found: ${values}"; return 1; }
                  helm lint "${CHART}" -f "${values}"
                  aws eks update-kubeconfig --name "${cluster}" --region "${AWS_DEFAULT_REGION}"
                  kubectl get nodes
                  kubectl create namespace "${namespace}" --dry-run=client -o yaml | kubectl apply -f -

                  if ! helm upgrade --install "$(HELM_RELEASE)" "${CHART}" \
                    --namespace "${namespace}" \
                    --create-namespace \
                    -f "${values}" \
                    --set-string mysql.image="${repository_uri}" \
                    --set-string mysql.tag="${tag}" \
                    --wait --timeout 10m; then
                    echo "ERROR: Helm deployment failed. Collecting diagnostics..."
                    helm status "$(HELM_RELEASE)" -n "${namespace}" || true
                    kubectl get pods,pvc,svc -n "${namespace}" -o wide || true
                    kubectl get events -n "${namespace}" --sort-by=.lastTimestamp | tail -40 || true
                    return 1
                  fi

                  helm status "$(HELM_RELEASE)" -n "${namespace}"
                  kubectl get pods,svc,pvc -n "${namespace}" -o wide
                }

                aws sts get-caller-identity
                login_ecr
                promote_image "${SOURCE_REPOSITORY}" "${SOURCE_TAG_UAT}" "${TARGET_REPOSITORY}" "${TARGET_TAG}"
                deploy_database prod "employee-mgm-prod-cluster" \
                  "${VALUES_FILE}" \
                  "${REGISTRY}/${TARGET_REPOSITORY}" "${TARGET_TAG}"
