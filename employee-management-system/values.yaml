
frontend:
  name: frontend
  replicas: 2
  image: docker.io/achalpadol/employee-frontend
  tag: v2
  containerPort: 80
  service:
    name: frontend-service
    type: ClusterIP
    port: 80

backend:
  name: backend
  replicas: 2
  image: docker.io/payalkharat/kubernetes-ingress
  tag: backend-v1
  containerPort: 5000
  configMapName: employee-cm
  secretName: mysql-secret
  service:
    name: app2-backend-service
    type: ClusterIP
    port: 5000

mysql:
  name: mysql
  replicas: 1
  image: docker.io/payalkharat/kubernetes-ingress
  tag: v1 
  containerPort: 3306
  secretName: mysql-secret
  persistence:
    existingClaim: mysql-pvc
    size: 2Gi
  service:
    name: mysql
    type: ClusterIP
    port: 3306

configMap:
  name: employee-cm
  stringData:
    DB_HOST: mysql
    DB_PORT: "3306"

secret:
  name: mysql-secret
  stringData:
    MYSQL_ROOT_PASSWORD: "rootpassword"
    MYSQL_DATABASE: "employee_db"
    MYSQL_USER: "employee_user"
    MYSQL_PASSWORD: "employee123"

storageClass:
  name: ebs-gp3
  volumeBindingMode: WaitForFirstConsumer
  allowVolumeExpansion: true
  parameters:
    type: gp3
    fsType: ext4

ingress:
  name: employee-management-ingress
  className: alb
  scheme: internet-facing
  targetType: ip
  host: employee.com
   

    
    

   

