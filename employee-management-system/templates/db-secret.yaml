apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
type: Opaque
data:
  MYSQL_ROOT_PASSWORD: {{ .Values.secret.data.MYSQL_ROOT_PASSWORD | quote }}
  MYSQL_DATABASE: {{ .Values.secret.data.MYSQL_DATABASE | quote }}
  MYSQL_USER: {{ .Values.secret.data.MYSQL_USER | quote }}
  MYSQL_PASSWORD: {{ .Values.secret.data.MYSQL_PASSWORD | quote }}
