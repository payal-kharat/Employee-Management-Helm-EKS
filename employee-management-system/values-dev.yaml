
frontend:
  enabled: true
  name: frontend
  replicas: 1
  image: ""
  tag: ""
  containerPort: 80
  service:
    name: frontend-service
    type: ClusterIP
    port: 80

backend:
  enabled: true
  name: backend
  replicas: 1
  image: ""
  tag: ""
  containerPort: 5000
  configMapName: employee-cm
  secretName: mysql-secret
  service:
    name: backend
    type: ClusterIP
    port: 5000

mysql:
  enabled: true
  name: mysql
  replicas: 1
  image: ""
  tag: "" 
  containerPort: 3306
  secretName: mysql-secret
  persistence:
    existingClaim: mysql-pvc
    size: 2Gi
  service:
    name: mysql
    type: ClusterIP
    port: 3306

configMap:
  enabled: true
  name: employee-cm
  data:
    DB_HOST: mysql
    DB_PORT: "3306"

secret:
  enabled: true
  name: mysql-secret
  stringData:
    MYSQL_ROOT_PASSWORD: ""
    MYSQL_DATABASE: ""
    MYSQL_USER: ""
    MYSQL_PASSWORD: ""

storageClass:
  enabled: true
  name: ebs-gp3
  volumeBindingMode: WaitForFirstConsumer
  allowVolumeExpansion: true
  parameters:
    type: gp3
    fsType: ext4

ingress:
  enabled: true
  name: employee-management-ingress
  className: alb
  scheme: internet-facing
  targetType: ip
  host: employee.com
   

    
    

   

